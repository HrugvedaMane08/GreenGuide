<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; background:#1b3b2f; }
    .box { background:white; padding:30px; border-radius:10px; width:350px; text-align:center; }
    input { width:100%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #ccc; }
    button { width:100%; padding:12px; background:#214734; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#2d5a46; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Forgot Password</h2>
    <p>Enter your email to reset your password</p>
    <form onsubmit="sendReset(event)">
      <input type="email" id="email" placeholder="Enter your email" required>
      <button type="submit">Send Reset Link</button>
    </form>
    <p id="msg"></p>
  </div>

<script>
  async function sendReset(event) {
    event.preventDefault();
    const email = document.getElementById("email").value;

    const res = await fetch("http://localhost:5000/api/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    const data = await res.json();
    document.getElementById("msg").innerText = data.message || data.error;
  }
</script>
</body>
</html>
