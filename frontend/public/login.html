<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - The Green Guide</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", Arial, sans-serif; }
    body {
      min-height: 100vh; background: #1b3b2f;
      display: flex; justify-content: center; align-items: center;
    }
    .container {
      background: white; width: 90%; max-width: 900px;
      display: flex; border-radius: 25px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    /* Left side */
    .illustration { 
      flex: 1; background: #e9f3ec;
      display: flex; justify-content: center; align-items: center; padding: 30px;
    }
    .illustration img { width: 100%; max-width: 350px; }
    /* Right side */
    .login-box {
      flex: 1; background: #214734; color: white;
      padding: 50px 40px; display: flex; flex-direction: column; justify-content: center;
    }
    .login-box h2 { margin-bottom: 30px; font-size: 2rem; font-weight: 600; }
    .form-group { margin-bottom: 20px; }
    label { display:block; font-size:0.9rem; margin-bottom:6px; color:#cde0d4; }
    input {
      width:100%; padding:12px; border:none; border-radius:25px;
      font-size:1rem; background:#2d5a46; color:white; outline:none;
    }
    input::placeholder { color:#aac6b7; }
    input:focus { box-shadow:0 0 0 2px #6bcf9d; }
    .forgot { display:block; margin-bottom:20px; text-align:right; font-size:0.85rem; color:#9dd6ba; text-decoration:none; }
    .forgot:hover { text-decoration:underline; }
    .btn {
      width:100%; padding:12px; font-size:1rem; font-weight:bold;
      border:none; border-radius:25px; background:#8fd0b4; color:#1b3b2f;
      cursor:pointer; transition:0.3s;
    }
    .btn:hover { background:#a5e1c9; }
    .register { text-align:center; margin-top:20px; font-size:0.9rem; color:#b9dfca; }
    .register a { color:#9dd6ba; text-decoration:none; font-weight:bold; }
    .register a:hover { text-decoration:underline; }
    .terms { text-align:center; margin-top:15px; font-size:0.75rem; color:#89b8a0; }
    .contact { margin-top:10px; font-size:0.75rem; color:#89b8a0; text-align:center; }
    .contact a { color:#9dd6ba; text-decoration:none; }
    .contact a:hover { text-decoration:underline; }
    @media (max-width: 768px) {
      .container { flex-direction:column; }
      .illustration { padding:20px; }
      .login-box { padding:30px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="illustration">
      <img src="https://i.pinimg.com/1200x/95/76/a4/9576a4ea2172b65c7e4d542526fda95c.jpg" alt="Login Illustration">
    </div>
    <div class="login-box">
      <h2>Login</h2>
      <form onsubmit="loginUser(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="text" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <a href="forgot.html" class="forgot">Forgot Password?</a>
        <button type="submit" class="btn">Login</button>
      </form>
      <div class="register">
        Don’t have an account? <a href="/signup">Register Now</a>
      </div>
      <div class="terms"><a href="#">Terms and Services</a></div>
      <div class="contact">Have a problem? Contact us at <a href="mailto:support@example.com">support@example.com</a></div>
    </div>
  </div>

  <script>
    async function loginUser(event) {
      event.preventDefault(); // Prevents page refresh

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:5000/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          alert("✅ Login successful! Redirecting to dashboard...");

          // 🚀 Store session info
          sessionStorage.setItem("userId", data.user.id);
          sessionStorage.setItem("userName", data.user.name);
          // 💡 CORRECTED LINE: Save the email to sessionStorage
          sessionStorage.setItem("email", data.user.email); 

          window.location.href = "/dashboard.html";
        } else if (res.status === 503) {
          alert("❌ The service is temporarily unavailable. Please try again shortly.");
        } else {
          alert("❌ " + (data.error || "Login failed. Please try again."));
        }
      } catch (err) {
        // err.message here is a network/parse failure, not something a user can
        // act on, so keep it in the console rather than in their face.
        console.error("Login request failed:", err);
        alert("❌ Could not reach the server. Please check your connection and try again.");
      }
    }
  </script>
</body>
</html>
